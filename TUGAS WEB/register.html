<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — MYPERPUS</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>
    <header>
        <div class="logo">
            <a href="index.html">MYPERPUS</a>
        </div>

        <nav class="nav">
            <ul>
                <a href="index.html">Home</a>
                <a href="library.html">Library</a>
                <a href="explore.html">Explore</a>
            </ul>
        </nav>

        <div class="kanan">
            <div class="search">
                <input type="text" placeholder="Cari...">
            </div>
        </div>
    </header>

    <main>
        <div class="auth-container">
            <div class="auth-card">
                <h2 class="auth-title">Daftar Akun</h2>
                <p class="auth-subtitle">Buat akun MYPERPUS baru</p>

                <div id="auth-message" class="auth-message hidden"></div>

                <form id="register-form" novalidate>
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Username kamu"
                            required
                            autocomplete="username"
                            minlength="3"
                            maxlength="50"
                        >
                        <span class="field-error" id="username-error"></span>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="contoh@email.com"
                            required
                            autocomplete="email"
                        >
                        <span class="field-error" id="email-error"></span>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-wrapper">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Minimal 8 karakter (huruf & angka)"
                                required
                                autocomplete="new-password"
                                minlength="8"
                            >
                            <button type="button" class="toggle-password" aria-label="Tampilkan password">
                                👁️
                            </button>
                        </div>
                        <span class="field-error" id="password-error"></span>
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Konfirmasi Password</label>
                        <div class="password-wrapper">
                            <input
                                type="password"
                                id="confirm-password"
                                name="confirm-password"
                                placeholder="Ulangi password"
                                required
                                autocomplete="new-password"
                            >
                            <button type="button" class="toggle-password" aria-label="Tampilkan password">
                                👁️
                            </button>
                        </div>
                        <span class="field-error" id="confirm-password-error"></span>
                    </div>

                    <button type="submit" class="btn-primary" id="btn-register">
                        <span class="btn-text">Daftar</span>
                        <span class="btn-loading hidden">Memproses...</span>
                    </button>
                </form>

                <p class="auth-footer">
                    Sudah punya akun? <a href="login.html">Login di sini</a>
                </p>
            </div>
        </div>
    </main>

    <script src="js/auth.js"></script>
</body>

</html>
