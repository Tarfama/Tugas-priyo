<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail buku</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar-dropdown.css">
    <link rel="stylesheet" href="css/detil.css">
</head>

<body>
    <header>
        <div class="logo">
            <a href="index.html">MYPERPUS</a>
        </div>

        <nav class="nav">
            <ul>
                <a href="index.html">Home</a>
                <a href="library.html">Library</a>
                <a href="explore.html">Explore</a>
            </ul>
        </nav>

        <div class="kanan">
            <div class="search">
                <input type="text" placeholder="Cari...">
            </div>
            <div class="profile" id="profile-area">
                <!-- Diisi dinamis oleh navbar-dropdown.js -->
            </div>
        </div>
    </header>

    <main class="detail">
        <!-- Pesan saat memuat atau gagal -->
        <p class="pesan" id="pesan">Memuat buku...</p>
        <!-- Isi halaman, tampil setelah data berhasil diambil -->
        <div class="hidden" id="isi">
            <div class="detail-cover">
                <img id="cover" src="" alt="Cover novel">
                <h1 id="judul"></h1>
                <p class="penulis" id="penulis"></p>
            </div>

            <div class="detail-box">
                <div class="detail-info">
                    <h2>Informasi buku</h2>
                    <ul class="info-list">
                        <li>
                            <p class="label">Penerbit</p>
                            <p class="isi" id="penerbit">-</p>
                        </li>
                        <li>
                            <p class="label">Tahun terbit</p>
                            <p class="isi" id="tahun">-</p>
                        </li>
                        <li>
                            <p class="label">Bahasa</p>
                            <p class="isi" id="bahasa">-</p>
                        </li>
                        <li>
                            <p class="label">Genre</p>
                            <p class="isi" id="genre">-</p>
                        </li>
                        <li>
                            <p class="label">Download</p>
                            <p class="isi" id="unduhan">-</p>
                        </li>
                    </ul>
                </div>

                <div class="detail-aksi">
                    <button class="btn-aksi" id="btn-bookmark">
                        <img id="icon-bookmark" src="bookmark.png" alt="bookmark"> Tambah ke bookmark
                    </button>
                    <a class="btn-aksi btn-baca" id="btn-baca" href="#" target="_blank">Baca sekarang</a>
                </div>
            </div>
        </div>
    </main>

    <script src="js/detail.js"></script>
    <script src="js/search.js"></script>
    <script src="js/navbar-dropdown.js"></script>
</body>

</html>
